<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="description" content="AR Disaster Scenarios - Emergency Preparedness Training">
	<title>AR Disaster Scenarios | Army National Guard</title>

	<style>
		/* Reset & Base */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html {
			min-height: 100vh;
			min-height: 100dvh; /* Dynamic viewport for mobile */
			background-color: #000000;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background-color: #000000;
			color: #ffffff;
			overflow-x: hidden;
			min-height: 100vh;
			min-height: 100dvh; /* Dynamic viewport for mobile */
			position: relative;
			overscroll-behavior-y: contain; /* Prevent pull-to-refresh */
		}

		/* Main container */
		.main-container {
			min-height: 100vh;
			min-height: 100dvh; /* Dynamic viewport for mobile */
			width: 100vw;
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 20px;
			padding-top: max(20px, env(safe-area-inset-top));
			padding-bottom: max(20px, env(safe-area-inset-bottom));
		}

		/* Fixed corner elements */
		.corner-element {
			position: fixed;
			z-index: 10;
		}

		.stripes-tl {
			top: 0;
			top: env(safe-area-inset-top, 0);
			left: 0;
			left: env(safe-area-inset-left, 0);
			width: 120px;
			height: 120px;
		}

		.stripes-br {
			bottom: 0;
			bottom: env(safe-area-inset-bottom, 0);
			right: 0;
			right: env(safe-area-inset-right, 0);
			width: 120px;
			height: 120px;
		}

		/* Header section */
		.header-section {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin-bottom: 50px;
			z-index: 5;
			opacity: 0;
			animation: fadeInUp 0.8s ease-out forwards;
		}

		.tagline {
			width: 260px;
			height: auto;
		}

		/* Disaster sections */
		.disaster-list {
			display: flex;
			flex-direction: column;
			gap: 35px;
			align-items: center;
			z-index: 5;
		}

		.disaster-item {
			display: flex;
			flex-direction: column;
			align-items: center;
			cursor: pointer;
			text-decoration: none;
			transition: transform 0.15s ease-out;
			opacity: 0;
			-webkit-tap-highlight-color: transparent;
			touch-action: manipulation;
			user-select: none;
		}

		.disaster-item:nth-child(1) {
			animation: fadeInUp 0.8s ease-out 0.2s forwards;
		}

		.disaster-item:nth-child(2) {
			animation: fadeInUp 0.8s ease-out 0.4s forwards;
		}

		.disaster-item:nth-child(3) {
			animation: fadeInUp 0.8s ease-out 0.6s forwards;
		}

		/* Desktop hover only */
		@media (hover: hover) and (pointer: fine) {
			.disaster-item:hover {
				transform: scale(1.08);
			}
		}

		/* Touch/tap for all devices */
		.disaster-item:active {
			transform: scale(0.92);
			transition: transform 0.1s ease-out;
		}

		.disaster-icon {
			width: 130px;
			height: auto;
		}

		/* Animations */
		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* Responsive adjustments */
		@media (max-width: 768px) {
			.stripes-tl, .stripes-br {
				width: 80px;
				height: 80px;
			}

			.tagline {
				width: 220px;
			}

			.disaster-icon {
				width: 110px;
			}

			.disaster-list {
				gap: 28px;
			}

			.header-section {
				margin-bottom: 40px;
			}
		}

		@media (max-width: 480px) {
			.stripes-tl, .stripes-br {
				width: 60px;
				height: 60px;
			}

			.tagline {
				width: 180px;
			}

			.disaster-icon {
				width: 90px;
			}

			.disaster-list {
				gap: 25px;
			}

			.header-section {
				margin-bottom: 35px;
			}
		}
	</style>
</head>
<body>
	<div class="main-container">
		<!-- Fixed corner stripes -->
		<img src="/assets/images/stripes.png" alt="" class="corner-element stripes-tl">
		<img src="/assets/images/stripes_BR.png" alt="" class="corner-element stripes-br">

		<!-- Header section -->
		<div class="header-section">
			<img src="/assets/images/Tagline.png" alt="Army National Guard - Uncommon is Calling" class="tagline">
		</div>

		<!-- Disaster list -->
		<div class="disaster-list">
			<!-- Quake -->
			<a href="/quake/" class="disaster-item">
				<img src="/assets/images/quake-badge.png" alt="Earthquake" class="disaster-icon">
			</a>

			<!-- Fire -->
			<a href="/fire/" class="disaster-item">
				<img src="/assets/images/fire-badge.png" alt="Fire" class="disaster-icon">
			</a>

			<!-- Flood -->
			<a href="/flood/" class="disaster-item">
				<img src="/assets/images/flood-badge.png" alt="Flood" class="disaster-icon">
			</a>
		</div>
	</div>
</body>
</html>
