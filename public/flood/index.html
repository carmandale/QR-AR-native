<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Flood Disaster Scenario - Launch AR experience">
	<title>Flood | AR Disaster Scenarios</title>

	<!-- Device Detection & AR Launcher -->
	<script src="/assets/js/device-detection.js"></script>
	<script src="/assets/js/ar-launcher.js"></script>

	<style>
		/* Reset & Base */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background-color: #000000;
			color: #ffffff;
			overflow: hidden;
			height: 100vh;
			width: 100vw;
			position: relative;
		}

		/* Full-screen container */
		.flood-container {
			height: 100vh;
			width: 100vw;
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		/* Flood background at bottom */
		.flood-background {
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 60vh;
			background-image: url('/assets/images/flood-bg.png');
			background-size: cover;
			background-position: center bottom;
			background-repeat: no-repeat;
			z-index: 1;
			pointer-events: none;
		}

		/* Fixed corner elements */
		.corner-element {
			position: fixed;
			z-index: 10;
		}

		.stripes {
			top: 0;
			left: 0;
			width: 120px;
			height: 120px;
		}

		.logo {
			top: 20px;
			right: 20px;
			width: 80px;
			height: auto;
		}

		/* Center content */
		.center-content {
			position: relative;
			z-index: 5;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 30px;
			padding: 20px;
		}

		.flood-badge {
			width: 180px;
			height: auto;
			animation: fadeIn 0.6s ease-out;
		}

		.launch-button {
			width: 280px;
			height: auto;
			cursor: pointer;
			transition: transform 0.2s ease;
			animation: fadeIn 1s ease-out;
		}

		.launch-button:hover {
			transform: scale(1.05);
		}

		.launch-button:active {
			transform: scale(0.95);
		}

		/* Animations */
		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(20px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* Responsive adjustments */
		@media (max-width: 768px) {
			.stripes {
				width: 80px;
				height: 80px;
			}

			.logo {
				width: 60px;
				top: 15px;
				right: 15px;
			}

			.flood-badge {
				width: 140px;
			}

			.launch-button {
				width: 220px;
			}
		}

		@media (max-width: 480px) {
			.stripes {
				width: 60px;
				height: 60px;
			}

			.logo {
				width: 50px;
				top: 10px;
				right: 10px;
			}

			.flood-badge {
				width: 120px;
			}

			.launch-button {
				width: 200px;
			}

			.center-content {
				gap: 20px;
			}
		}

		/* Hidden AR link for iOS Quick Look */
		#ios-ar-link {
			display: none;
		}
	</style>
</head>
<body>
	<div class="flood-container">
		<!-- Flood background image -->
		<div class="flood-background"></div>

		<!-- Fixed corner elements -->
		<img src="/assets/images/stripes.png" alt="" class="corner-element stripes">
		<img src="/assets/images/Logo-2.png" alt="Army National Guard" class="corner-element logo">

		<!-- Center content -->
		<div class="center-content">
			<img src="/assets/images/flood-badge.png" alt="Flood Warning" class="flood-badge">
			<img
				src="/assets/images/launch-2.png"
				alt="Launch AR"
				class="launch-button"
				id="launch-button"
				role="button"
				tabindex="0"
			>
		</div>

		<!-- Hidden iOS Quick Look link -->
		<a id="ios-ar-link" rel="ar" href="/models/flood.usdz">
			<img src="/assets/images/flood-badge.png" alt="Launch AR">
		</a>
	</div>

	<script>
		// Model configuration
		const FLOOD_MODEL = {
			usdz: '/models/flood.usdz',
			glb: '/models/flood.glb',
			name: 'Flood Disaster Scenario'
		};

		// Initialize on page load
		window.addEventListener('DOMContentLoaded', () => {
			const launchButton = document.getElementById('launch-button');
			const iosArLink = document.getElementById('ios-ar-link');

			// Detect device capabilities
			const device = detectDevice();
			console.log('Device detected:', device);

			// Launch AR function
			function launchAR() {
				if (device.arMethod === 'quicklook') {
					// iOS: Trigger Quick Look via hidden link
					console.log('Launching iOS Quick Look AR');
					iosArLink.click();
				} else if (device.arMethod === 'sceneviewer') {
					// Android: Launch Scene Viewer
					console.log('Launching Android Scene Viewer');
					try {
						launchAndroidSceneViewer(FLOOD_MODEL.glb, FLOOD_MODEL.name);
					} catch (error) {
						console.error('Failed to launch AR:', error);
						alert('Failed to launch AR viewer. Please ensure Google AR Services is installed.');
					}
				} else {
					// Desktop or unsupported device
					console.log('AR not supported on this device');
					alert('AR viewing requires a mobile device.\n\nSupported devices:\n• iOS 12+ (iPhone 7 or newer)\n• ARCore-compatible Android device (Android 7.0+)\n\nPlease scan the QR code with your mobile device.');
				}
			}

			// Add click handler to launch button
			launchButton.addEventListener('click', launchAR);

			// Add keyboard accessibility
			launchButton.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' || e.key === ' ') {
					e.preventDefault();
					launchAR();
				}
			});
		});
	</script>
</body>
</html>
